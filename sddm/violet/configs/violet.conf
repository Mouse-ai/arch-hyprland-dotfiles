; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = violet-login.webp
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 130
background = "violet-login.webp"
use-background-color = false
background-color = "#F5F0E7"
blur = 0
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "center-left"
align = "center"
format = "hh:mm"
font-family = "Cormorant Garamond"
font-size = 110
font-weight = 500
color = "#38342F"

[LockScreen.Date]
display = true
format = "dd / dddd, MMMM"
locale = "en_US"
font-family = "Cormorant Garamond"
font-size = 22
font-weight = 400
color = "#86534C"
margin-top = 0

[LockScreen.Message]
display = false
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "Cormorant Garamond"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#38342F"
paint-icon = true
spacing = 0

[LoginScreen]
background = "violet-transition.png"
use-background-color = false
background-color = "#F5F0E7"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "left"
margin = 150

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 30
active-size = 80
inactive-size = 80
inactive-opacity = 0.5
active-border-size = 0
inactive-border-size = 0
active-border-color = "#86534C"
inactive-border-color = "#86534C"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Cormorant Garamond"
font-size = 42
font-weight = 500
color = "#38342F"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 300
height = 48
display-icon = false
font-family = "Cormorant Garamond"
font-size = 18
icon = "password.svg"
icon-size = 16
content-color = "#38342F"
background-color = "#E8E2D5"
background-opacity = 1.0
border-size = 0
border-color = "#86534C"
border-radius-left = 15
border-radius-right = 0
margin-top = 24
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#E8E2D5"
background-opacity = 1.0
active-background-color = "#DCD3C4"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#86534C"
active-content-color = "#38342F"
border-size = 0
border-color = "#86534C"
border-radius-left = 0
border-radius-right = 15
margin-left = 0
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Cormorant Garamond"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Cormorant Garamond"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#38342F"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Cormorant Garamond"
font-size = 11
font-weight = 400
normal-color = "#38342F"
warning-color = "#FFA500"
error-color = "#86534C"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 0
size = 30
border-radius = 15
spacing = 10
font-family = "Cormorant Garamond"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#F5F0E7"
background-opacity = 1.0
active-option-background-color = "#E5DDCE"
active-option-background-opacity = 1.0
content-color = "#38342F"
active-content-color = "#86534C"
font-family = "Cormorant Garamond"
border-size = 0
border-color = "#86534C"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-right"
index = 1
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = -1
popup-width = 200
background-color = "#F5F0E7"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#38342F"
active-content-color = "#38342F"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 2
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = false
background-color = "#F5F0E7"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#38342F"
active-content-color = "#38342F"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 3
background-color = "#F5F0E7"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#38342F"
active-content-color = "#38342F"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 4
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#F5F0E7"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#38342F"
active-content-color = "#38342F"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#F5F0E7"
background-opacity = 1.0
key-content-color = "#38342F"
key-color = "#E5DDCE"
key-opacity = 1.0
key-active-background-color = "#E5DDCE"
key-active-opacity = 1.0
selection-background-color = "#F5F0E7"
selection-content-color = "#38342F"
primary-color = "#86534C"
border-size = 0
border-color = "#86534C"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Cormorant Garamond"
font-size = 11
content-color = "#38342F"
background-color = "#F5F0E7"
background-opacity = 1.0
border-radius = 5
disable-user = false
disable-login-button = true
