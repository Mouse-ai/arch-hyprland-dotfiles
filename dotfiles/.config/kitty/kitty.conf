shell /usr/bin/fish

font_family JetBrainsMono Nerd Font Mono
font_size 12.0

background #171220
foreground #eae3f1
background_opacity 0.94
# Render the Yazi background at the terminal opacity.
transparent_background_colors #121615
selection_background #4e3868
selection_foreground #f6edff
cursor #bfa0f5
cursor_text_color #171220
cursor_shape beam

window_padding_width 12
tab_bar_style fade
tab_bar_min_tabs 2
tab_bar_background #171220
active_tab_background #3c2d50
active_tab_foreground #f5edff
inactive_tab_background #21192d
inactive_tab_foreground #a98fbc

color0  #231b2e
color1  #ec8899
color2  #abd5ad
color3  #e3c19c
color4  #a7b6f0
color5  #bfa0f5
color6  #a6cedc
color7  #eae3f1
color8  #8d819b
color9  #f5a9b6
color10 #c3e6c0
color11 #f0d2b1
color12 #c2cbff
color13 #d9bcff
color14 #bee5ee
color15 #fbf5ff

# Palette generated by Caelestia.
globinclude caelestia-theme.conf
