#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated by Caelestia. Edit the yazi.toml template in caelestia/templates.

[app]
overall = { fg = "#E9EEE9", bg = "#121615" }

[mgr]
cwd = { fg = "#{{ primaryFixedDim.hex }}", bold = true }
border_style = { fg = "#63736A" }
find_keyword = { fg = "#{{ tertiaryFixed.hex }}", bold = true }
find_position = { fg = "#{{ primaryFixedDim.hex }}", bold = true }
marker_selected = { fg = "#{{ primaryFixedDim.hex }}", bg = "#{{ primaryFixedDim.hex }}" }
marker_copied = { fg = "#A9DAB4", bg = "#A9DAB4" }
marker_cut = { fg = "#F2A2A3", bg = "#F2A2A3" }
count_selected = { fg = "#{{ onPrimaryFixed.hex }}", bg = "#{{ primaryFixedDim.hex }}" }

[indicator]
parent = { fg = "#E9EEE9", bg = "#202824" }
current = { fg = "#{{ primaryFixed.hex }}", bg = "#{{ onPrimaryFixedVariant.hex }}", bold = true }
preview = { fg = "#{{ secondaryFixed.hex }}", underline = true }

[tabs]
active = { fg = "#{{ onPrimaryFixed.hex }}", bg = "#{{ primaryFixedDim.hex }}", bold = true }
inactive = { fg = "#B4C2B9", bg = "#202824" }

[mode]
normal_main = { fg = "#{{ onPrimaryFixed.hex }}", bg = "#{{ primaryFixedDim.hex }}", bold = true }
normal_alt = { fg = "#E9EEE9", bg = "#202824" }
select_main = { fg = "#{{ onSecondaryFixed.hex }}", bg = "#{{ secondaryFixed.hex }}", bold = true }
select_alt = { fg = "#{{ secondaryFixed.hex }}", bg = "#202824" }
unset_main = { fg = "#38191B", bg = "#F2A2A3", bold = true }
unset_alt = { fg = "#F2A2A3", bg = "#202824" }

[status]
overall = { fg = "#E9EEE9", bg = "#191F1C" }
perm_sep = { fg = "#B4C2B9" }
perm_type = { fg = "#{{ primaryFixedDim.hex }}" }
perm_read = { fg = "#{{ tertiaryFixed.hex }}" }
perm_write = { fg = "#F2A2A3" }
perm_exec = { fg = "#A9DAB4" }

[input]
border = { fg = "#{{ primaryFixedDim.hex }}" }
title = { fg = "#{{ secondaryFixed.hex }}", bold = true }
selected = { fg = "#{{ primaryFixed.hex }}", bg = "#{{ onPrimaryFixedVariant.hex }}" }

[confirm]
border = { fg = "#{{ primaryFixedDim.hex }}" }
title = { fg = "#{{ secondaryFixed.hex }}", bold = true }

[help]
border = { fg = "#{{ primaryFixedDim.hex }}" }
chord = { fg = "#{{ secondaryFixed.hex }}" }
hovered = { fg = "#{{ primaryFixed.hex }}", bg = "#{{ onPrimaryFixedVariant.hex }}", bold = true }

[filetype]
rules = [
    { url = "*", is = "orphan", fg = "#F2A2A3" },
    { url = "*", is = "dummy", fg = "#F2A2A3" },
    { url = "*/", is = "dummy", fg = "#F2A2A3" },
    { url = "*/", fg = "#{{ primaryFixedDim.hex }}" },
    { mime = "**/image/*", fg = "#{{ tertiaryFixed.hex }}" },
    { mime = "**/{audio,video}/*", fg = "#{{ secondaryFixed.hex }}" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#{{ secondaryFixed.hex }}" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#{{ tertiaryFixed.hex }}" },
    { mime = "vfs/{absent,stale}", fg = "#B4C2B9" },
    { url = "*", is = "exec", fg = "#A9DAB4" },
    { url = "*", fg = "#E9EEE9" },
]

[icon]
prepend_dirs = [
    { name = "Documents", text = "", fg = "#{{ secondaryFixed.hex }}" },
    { name = "Downloads", text = "", fg = "#{{ secondaryFixed.hex }}" },
    { name = "Pictures", text = "", fg = "#{{ secondaryFixed.hex }}" },
]
prepend_conds = [
    { if = "dir & hovered", text = "", fg = "#{{ secondaryFixed.hex }}" },
    { if = "dir", text = "", fg = "#{{ secondaryFixed.hex }}" },
]
