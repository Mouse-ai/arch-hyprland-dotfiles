#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated by Caelestia. Edit the yazi.toml template in caelestia/templates.

[app]
overall = { fg = "#E9EEE9", bg = "#121615" }

[mgr]
cwd = { fg = "#c1ddae", bold = true }
border_style = { fg = "#63736A" }
find_keyword = { fg = "#fbf3ad", bold = true }
find_position = { fg = "#c1ddae", bold = true }
marker_selected = { fg = "#c1ddae", bg = "#c1ddae" }
marker_copied = { fg = "#A9DAB4", bg = "#A9DAB4" }
marker_cut = { fg = "#F2A2A3", bg = "#F2A2A3" }
count_selected = { fg = "#2f4523", bg = "#c1ddae" }

[indicator]
parent = { fg = "#E9EEE9", bg = "#202824" }
current = { fg = "#cfebbb", bg = "#4a623d", bold = true }
preview = { fg = "#d9e7cb", underline = true }

[tabs]
active = { fg = "#2f4523", bg = "#c1ddae", bold = true }
inactive = { fg = "#B4C2B9", bg = "#202824" }

[mode]
normal_main = { fg = "#2f4523", bg = "#c1ddae", bold = true }
normal_alt = { fg = "#E9EEE9", bg = "#202824" }
select_main = { fg = "#36432e", bg = "#d9e7cb", bold = true }
select_alt = { fg = "#d9e7cb", bg = "#202824" }
unset_main = { fg = "#38191B", bg = "#F2A2A3", bold = true }
unset_alt = { fg = "#F2A2A3", bg = "#202824" }

[status]
overall = { fg = "#E9EEE9", bg = "#191F1C" }
perm_sep = { fg = "#B4C2B9" }
perm_type = { fg = "#c1ddae" }
perm_read = { fg = "#fbf3ad" }
perm_write = { fg = "#F2A2A3" }
perm_exec = { fg = "#A9DAB4" }

[input]
border = { fg = "#c1ddae" }
title = { fg = "#d9e7cb", bold = true }
selected = { fg = "#cfebbb", bg = "#4a623d" }

[confirm]
border = { fg = "#c1ddae" }
title = { fg = "#d9e7cb", bold = true }

[help]
border = { fg = "#c1ddae" }
chord = { fg = "#d9e7cb" }
hovered = { fg = "#cfebbb", bg = "#4a623d", bold = true }

[filetype]
rules = [
    { url = "*", is = "orphan", fg = "#F2A2A3" },
    { url = "*", is = "dummy", fg = "#F2A2A3" },
    { url = "*/", is = "dummy", fg = "#F2A2A3" },
    { url = "*/", fg = "#c1ddae" },
    { mime = "**/image/*", fg = "#fbf3ad" },
    { mime = "**/{audio,video}/*", fg = "#d9e7cb" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#d9e7cb" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fbf3ad" },
    { mime = "vfs/{absent,stale}", fg = "#B4C2B9" },
    { url = "*", is = "exec", fg = "#A9DAB4" },
    { url = "*", fg = "#E9EEE9" },
]

[icon]
prepend_dirs = [
    { name = "Documents", text = "", fg = "#d9e7cb" },
    { name = "Downloads", text = "", fg = "#d9e7cb" },
    { name = "Pictures", text = "", fg = "#d9e7cb" },
]
prepend_conds = [
    { if = "dir & hovered", text = "", fg = "#d9e7cb" },
    { if = "dir", text = "", fg = "#d9e7cb" },
]
